# One description, three native formats: nfpm package -p deb|rpm|archlinux
# Paths are relative to the repository root; VERSION and ARCH come from
# the environment (packaging/build-packages.sh sets them).
name: flatshot
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
release: "1"
section: graphics
priority: optional
maintainer: nicholas-sbx <nicholas-sbx@users.noreply.github.com>
description: |
  Region screenshots for Wayland and X11 (KDE first) with a floating draw toolbar.
  Drag to capture instantly, or annotate first with pen, arrows, shapes,
  text, highlighter, pixelate and counters. QR codes and barcodes on screen
  are detected with one-click Copy / Open. A single native binary.
homepage: https://github.com/nicholas-sbx/screenshot-rs
license: MIT

archlinux:
  packager: nicholas-sbx <nicholas-sbx@users.noreply.github.com>

contents:
  - src: ./target/release/flatshot
    dst: /usr/bin/flatshot
    file_info:
      mode: 0755
  - src: ./packaging/flatshot.desktop
    dst: /usr/share/applications/flatshot.desktop
  # KWin's screenshot API for /usr/bin/flatshot (see the file)
  - src: ./packaging/flatshot-kwin.desktop
    dst: /usr/share/applications/flatshot-kwin.desktop
  # Flatshot's notification events, for KDE's per-event notification settings
  - src: ./assets/flatshot.notifyrc
    dst: /usr/share/knotifications6/flatshot.notifyrc
  - src: ./assets/flatshot.notifyrc
    dst: /usr/share/knotifications5/flatshot.notifyrc
  - src: ./assets/flatshot.svg
    dst: /usr/share/icons/hicolor/scalable/apps/flatshot.svg
  - src: ./assets/flatshot.png
    dst: /usr/share/icons/hicolor/256x256/apps/flatshot.png
  - src: ./LICENSE
    dst: /usr/share/licenses/flatshot/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/flatshot/README.md

overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
    recommends:
      - fonts-dejavu-core | fonts-noto-core
      - wl-clipboard
      - xdg-utils
      # screen recording on KDE and GNOME: the portal's stream, the encoders
      - gstreamer1.0-tools
      - gstreamer1.0-pipewire
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-ugly
    suggests:
      - kde-spectacle | grim
      - libnotify-bin
      - ffmpeg  # pausing a recording, GIFs, recording on X11
      - wf-recorder  # screen recording on wlroots compositors
      - xclip  # X11: keep the clipboard after a one-off capture exits
  rpm:
    depends:
      - glibc >= 2.35
      - libgcc
      - libxkbcommon
    recommends:
      - dejavu-sans-fonts
      - wl-clipboard
      - xdg-utils
      # screen recording: the portal's stream, encoders, pausing and GIFs
      - gstreamer1
      - pipewire-gstreamer
      - gstreamer1-plugins-good
      - gstreamer1-plugin-openh264
      - ffmpeg-free
    suggests:
      - xclip  # X11: keep the clipboard after a one-off capture exits
  archlinux:
    depends:
      - glibc
      - gcc-libs
      - libxkbcommon
      - ttf-font
    recommends:
      - wl-clipboard
      - xdg-utils
      - gst-plugin-pipewire
      - gst-plugins-good
      - gst-plugins-ugly
      - ffmpeg
    suggests:
      - spectacle
      - wf-recorder
      - grim
      - xclip
