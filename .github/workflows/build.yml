# Tests every push and pull request (and weekly, with the dependency
# audit, so new security advisories show up). A push to main whose Cargo.toml
# version has no v<version> tag yet also builds the packages, installs
# them on Debian, Ubuntu, Fedora and Arch, publishes them as a GitHub
# release, and updates the pacman and apt repositories (the "pacman" and
# "apt" releases).
# "Run workflow" in the Actions tab does the same on demand.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NFPM_VERSION: "2.43.0"
  # (pinned: a new Rust's new lints can't break the build unannounced)
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          release=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] \
             && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $version, release: $release" >> "$GITHUB_STEP_SUMMARY"

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: cargo-audit
        run: cargo install cargo-audit --locked
      - name: Known vulnerabilities, unsound or unmaintained crates in Cargo.lock (RustSec)
        run: cargo audit --deny warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Faster apt
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          sudo rm -f /var/lib/man-db/auto-update
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libxkbcommon-dev sway grim wl-clipboard dbus fonts-dejavu-core python3 ffmpeg wf-recorder xvfb xkb-data stalonetray
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Self-test
        run: |
          cargo build --locked --bins --examples
          FLATSHOT_SELFTEST_OUT=shots ./target/debug/flatshot-rs --self-test
      - name: End to end on a headless sway (overlay, pins, editor, settings, recording, instant captures, clipboard, tray app)
        run: timeout 300 ./tests/e2e.sh
      - name: End to end on a headless X server (the same, on X11)
        run: timeout 300 ./tests/e2e-x11.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test-frames
          path: shots/
          if-no-files-found: ignore

  packages:
    needs: version
    # The oldest supported base (glibc 2.35): the binary runs on it and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libxkbcommon-dev
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.deb "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build the packages
        run: ./packaging/build-packages.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - name: The release binary passes its self-test
        run: ./target/release/flatshot-rs --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  install:
    # (images from the Docker library's mirror on ECR: Docker Hub limits
    # pulls from shared runners)
    name: install (${{ matrix.image }})
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: public.ecr.aws/docker/library/ubuntu:22.04
            install: apt-get update -q && apt-get install -y -q ./dist/*.deb
          - image: public.ecr.aws/docker/library/ubuntu:24.04
            install: apt-get update -q && apt-get install -y -q ./dist/*.deb
          - image: public.ecr.aws/docker/library/debian:bookworm
            install: apt-get update -q && apt-get install -y -q ./dist/*.deb
          - image: public.ecr.aws/docker/library/debian:trixie
            install: apt-get update -q && apt-get install -y -q ./dist/*.deb
          - image: public.ecr.aws/docker/library/fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: public.ecr.aws/docker/library/archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./dist/*.pkg.tar.zst
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Install the package
        env:
          DEBIAN_FRONTEND: noninteractive
        run: ${{ matrix.install }}
      - name: Check the installed package
        run: |
          command -v flatshot-rs
          flatshot-rs --version
          grep -qx 'Exec=/usr/bin/flatshot-rs' /usr/share/applications/flatshot-rs-kwin.desktop
          grep -qx 'X-KDE-DBUS-Restricted-Interfaces=org.kde.KWin.ScreenShot2' /usr/share/applications/flatshot-rs-kwin.desktop
          test -f /usr/share/knotifications6/flatshot-rs.notifyrc
          test -f /usr/share/icons/hicolor/scalable/apps/flatshot-rs.svg
          flatshot-rs --self-test

  release:
    needs: [version, audit, test, packages, install]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Flatshot RS ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*

  pacman-repo:
    # A pacman repository on the fixed "pacman" release, updated by each
    # release:
    #   [flatshot-rs]
    #   Server = https://github.com/<owner>/<repo>/releases/download/pacman
    # With a REPO_GPG_KEY secret (an armored private key without a
    # passphrase; PACMAN_GPG_KEY, its old name, also works), the packages
    # and the database are signed, and its public key is published with
    # them (flatshot-rs.asc). Without one, they aren't.
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: public.ecr.aws/docker/library/archlinux:latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Build the repository database
        id: repo
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY || secrets.PACMAN_GPG_KEY }}
        run: |
          pacman -Syu --noconfirm --needed gnupg
          mkdir repo
          cp dist/*.pkg.tar.zst repo/
          cd repo
          sign=()
          if [ -n "${REPO_GPG_KEY:-}" ]; then
            printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --import
            key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
            for p in ./*.pkg.tar.zst; do gpg --batch --yes --detach-sign --local-user "$key" "$p"; done
            sign=(--sign --key "$key")
            gpg --batch --armor --export "$key" > flatshot-rs.asc
            echo "fingerprint=$key" >> "$GITHUB_OUTPUT"
          fi
          repo-add "${sign[@]}" flatshot-rs.db.tar.gz ./*.pkg.tar.zst
          # Release assets can't be links: real copies under the names pacman asks for.
          for f in flatshot-rs.db flatshot-rs.files; do
            rm -f "$f" "$f.sig"
            cp "$f.tar.gz" "$f"
            [ -f "$f.tar.gz.sig" ] && cp "$f.tar.gz.sig" "$f.sig"
          done
          ls -l
      - name: Install from the repository with pacman (as the README says)
        env:
          FINGERPRINT: ${{ steps.repo.outputs.fingerprint }}
        run: |
          if [ -n "$FINGERPRINT" ]; then
            # Signed: only packages and a database signed with this key.
            pacman-key --add repo/flatshot-rs.asc
            pacman-key --lsign-key "$FINGERPRINT"
            level=Required
          else
            level=Never
          fi
          printf '\n[flatshot-rs]\nSigLevel = %s\nServer = file://%s/repo\n' "$level" "$PWD" >> /etc/pacman.conf
          pacman -Sy --noconfirm flatshot-rs
          flatshot-rs --version
          flatshot-rs --self-test
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pacman
          name: Pacman repository
          prerelease: true
          make_latest: false
          body: |
            Flatshot RS's pacman repository. Add this to `/etc/pacman.conf`:

            ```ini
            [flatshot-rs]
            SigLevel = ${{ steps.repo.outputs.fingerprint && 'Required' || 'Never' }}
            Server = https://github.com/${{ github.repository }}/releases/download/pacman
            ```

            ${{ steps.repo.outputs.fingerprint && format('The packages and the database are signed with the key `{0}` (`flatshot-rs.asc` here): add it first with `sudo pacman-key --add flatshot-rs.asc` and `sudo pacman-key --lsign-key {0}`. To skip the signatures, use `SigLevel = Never`.', steps.repo.outputs.fingerprint) || 'The packages are not signed.' }}

            Then `sudo pacman -Sy flatshot-rs`. New versions arrive with `sudo pacman -Syu`. The README has the details.
          files: repo/*

  apt-repo:
    # A flat apt repository on the fixed "apt" release, updated by each
    # release:
    #   deb [signed-by=/usr/share/keyrings/flatshot-rs.gpg] https://github.com/<owner>/<repo>/releases/download/apt ./
    # Signed (InRelease, Release.gpg) with the same REPO_GPG_KEY as the
    # pacman repository, whose public key is published with it
    # (flatshot-rs.gpg for apt's signed-by, flatshot-rs.asc armored).
    # Without one it isn't, and apt only takes it with [trusted=yes].
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # (on the runner itself, an Ubuntu: no image to pull)
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Build the repository index
        id: repo
        env:
          DEBIAN_FRONTEND: noninteractive
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY || secrets.PACMAN_GPG_KEY }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dpkg-dev apt-utils gnupg
          mkdir repo
          cp dist/*.deb repo/
          cd repo
          # Filenames relative to the repository (a flat one: no ./ needed).
          dpkg-scanpackages --multiversion . /dev/null | sed 's|^Filename: \./|Filename: |' > Packages
          gzip -9kn Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=flatshot-rs \
            -o APT::FTPArchive::Release::Label="Flatshot RS" \
            -o APT::FTPArchive::Release::Description="Flatshot RS releases" \
            release . > ../Release
          mv ../Release Release
          if [ -n "${REPO_GPG_KEY:-}" ]; then
            printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --import
            key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
            gpg --batch --yes --local-user "$key" --clearsign -o InRelease Release
            gpg --batch --yes --local-user "$key" --armor --detach-sign -o Release.gpg Release
            gpg --batch --export "$key" > flatshot-rs.gpg
            gpg --batch --armor --export "$key" > flatshot-rs.asc
            echo "fingerprint=$key" >> "$GITHUB_OUTPUT"
          fi
          ls -l
          cat Release
      - name: Install from the repository with apt (as the README says)
        env:
          DEBIAN_FRONTEND: noninteractive
          FINGERPRINT: ${{ steps.repo.outputs.fingerprint }}
        run: |
          if [ -n "$FINGERPRINT" ]; then
            sudo install -Dm644 repo/flatshot-rs.gpg /usr/share/keyrings/flatshot-rs.gpg
            opts="signed-by=/usr/share/keyrings/flatshot-rs.gpg"
          else
            opts="trusted=yes"
          fi
          # (somewhere apt's unprivileged downloader can read)
          sudo cp -r repo /srv/flatshot-rs
          sudo chmod -R a+rX /srv/flatshot-rs
          echo "deb [$opts] file:///srv/flatshot-rs ./" | sudo tee /etc/apt/sources.list.d/flatshot-rs.list
          sudo apt-get update -q
          sudo apt-get install -y -q flatshot-rs
          flatshot-rs --version
          flatshot-rs --self-test
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apt
          name: Apt repository
          prerelease: true
          make_latest: false
          body: |
            Flatshot RS's apt repository (Debian 12+, Ubuntu 22.04+, KDE neon). ${{ steps.repo.outputs.fingerprint && format('Signed with the key `{0}` (`flatshot-rs.gpg` here):', steps.repo.outputs.fingerprint) || 'Not signed yet:' }}

            ```sh
            ${{ steps.repo.outputs.fingerprint && format('curl -fsSL https://github.com/{0}/releases/download/apt/flatshot-rs.gpg | sudo tee /usr/share/keyrings/flatshot-rs.gpg >/dev/null', github.repository) || '' }}
            echo "deb [${{ steps.repo.outputs.fingerprint && 'signed-by=/usr/share/keyrings/flatshot-rs.gpg' || 'trusted=yes' }}] https://github.com/${{ github.repository }}/releases/download/apt ./" | sudo tee /etc/apt/sources.list.d/flatshot-rs.list
            sudo apt update && sudo apt install flatshot-rs
            ```

            New versions arrive with `sudo apt upgrade`. The README has the details, and how to use it without the signatures.
          files: repo/*
